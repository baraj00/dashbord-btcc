services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: btcc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: btcc_explorer
      POSTGRES_USER: btcc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-btccpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcc -d btcc_explorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: btcc_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Indexer ───────────────────────────────────────────────────────────────
  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    container_name: btcc_indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EXPLORER_URL: ${EXPLORER_URL:-https://explorer.bitcoin-classic.net}
      EXPLORER_TIMEOUT: ${EXPLORER_TIMEOUT:-30000}
      EXPLORER_MAX_RETRIES: ${EXPLORER_MAX_RETRIES:-5}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: btcc_explorer
      DB_USER: btcc
      DB_PASSWORD: ${DB_PASSWORD:-btccpassword}
      REDIS_URL: redis://redis:6379
      POLL_INTERVAL: ${POLL_INTERVAL:-5000}
      BATCH_SIZE: ${BATCH_SIZE:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - indexer_logs:/app/logs

  # ── API Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: btcc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: btcc_explorer
      DB_USER: btcc
      DB_PASSWORD: ${DB_PASSWORD:-btccpassword}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    container_name: btcc_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # INTERNAL_API_URL: used by SSR server components (Docker-internal hostname)
      INTERNAL_API_URL: http://backend:3001
      # NEXT_PUBLIC_WS_URL: baked at build time, used by browser WebSocket
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  indexer_logs:
  backend_logs:

networks:
  default:
    name: btcc_network
