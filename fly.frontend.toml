app = 'btcc-explorer'
primary_region = 'cdg'

[build]
  dockerfile = 'frontend/Dockerfile'
  [build.args]
    NEXT_PUBLIC_WS_URL = 'wss://btcc-backend.fly.dev'
    INTERNAL_API_URL = 'https://btcc-backend.fly.dev'

[env]
  NODE_ENV = 'production'
  INTERNAL_API_URL = 'http://btcc-backend.internal:3001'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
